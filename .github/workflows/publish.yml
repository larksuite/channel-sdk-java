name: Publish to Maven Central

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish signed artifacts
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up JDK 8 and OSSRH credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          server-id: ossrh
          server-username: OSSRH_USERNAME
          server-password: OSSRH_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Validate release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Run this workflow against a release tag." >&2
            exit 1
          fi
          project_version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [[ "$project_version" == *-SNAPSHOT ]]; then
            echo "Snapshot versions cannot be published as releases: $project_version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$project_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $project_version." >&2
            exit 1
          fi

      - name: Verify release
        run: ./scripts/verify.sh

      - name: Deploy signed artifacts through OSSRH staging
        run: mvn --batch-mode --no-transfer-progress -Prelease deploy
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
